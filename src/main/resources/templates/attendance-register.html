<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Attendance - QR Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f5f8fc;
            font-family: Arial, Helvetica, sans-serif;
            color: #162033;
        }

        .main-navbar {
            background: #071a2f;
            padding: 12px 0;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            background: white;
            color: #0d6efd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .brand-title {
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.1;
        }

        .brand-subtitle {
            color: #aeb9c7;
            font-size: 0.72rem;
        }

        .page-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            align-items: center;
            padding: 35px 0;
        }

        .attendance-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 28px rgba(25, 40, 60, 0.10);
            overflow: hidden;
        }

        .attendance-header {
            background: #071a2f;
            color: white;
            text-align: center;
            padding: 24px;
        }

        .attendance-body {
            padding: 30px;
        }

        .class-badge {
            display: inline-block;
            background: #eaf2ff;
            color: #0d6efd;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
            color: #445066;
        }

        .form-control {
            border-radius: 10px;
            padding: 13px;
        }

        .register-button {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .success-check {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e7f8ef;
            color: #198754;
            font-size: 3.2rem;
        }

        .success-title {
            color: #198754;
            font-weight: 800;
        }

        .success-info {
            background: #f3fbf6;
            border-radius: 12px;
            padding: 18px;
            margin-top: 20px;
        }

        .error-box {
            border-radius: 12px;
        }

        @media (max-width: 576px) {
            .attendance-body {
                padding: 24px 18px;
            }

            .page-wrapper {
                padding: 20px 0;
                align-items: flex-start;
            }

            .brand-subtitle {
                display: none;
            }
        }
    </style>
</head>

<body>

<nav class="main-navbar">

    <div class="container">

        <a href="/" class="text-decoration-none">

            <div class="d-flex align-items-center">

                <div class="brand-logo me-3">
                    <i class="bi bi-qr-code"></i>
                </div>

                <div>
                    <div class="brand-title">
                        QR Attendance
                    </div>

                    <div class="brand-subtitle">
                        Student Management System
                    </div>
                </div>

            </div>

        </a>

    </div>

</nav>

<div class="page-wrapper">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-5">

                <div class="card attendance-card">

                    <div class="attendance-header">

                        <i class="bi bi-phone-fill fs-2"></i>

                        <h2 class="mt-2 mb-1">
                            Register Attendance
                        </h2>

                        <small class="text-white-50">
                            Student Check-In
                        </small>

                    </div>

                    <div class="attendance-body">

                        <!-- SUCCESS -->
                        <div th:if="${success}" class="text-center">

                            <div class="success-check">
                                <i class="bi bi-check-lg"></i>
                            </div>

                            <h3 class="success-title">
                                Attendance Registered!
                            </h3>

                            <p class="text-muted">
                                Your attendance has been successfully recorded.
                            </p>

                            <div class="success-info text-start">

                                <p class="mb-2">
                                    <i class="bi bi-person-fill text-success me-2"></i>
                                    <strong>Student:</strong>
                                    <span th:text="${studentName}"></span>
                                </p>

                                <p class="mb-2">
                                    <i class="bi bi-book-fill text-success me-2"></i>
                                    <strong>Course:</strong>
                                    <span th:text="${classSession.courseName}"></span>
                                </p>

                                <p class="mb-0">
                                    <i class="bi bi-calendar-check-fill text-success me-2"></i>
                                    <strong>Session Date:</strong>
                                    <span th:text="${classSession.sessionDate}"></span>
                                </p>

                            </div>

                        </div>

                        <!-- NORMAL FORM -->
                        <div th:unless="${success}">

                            <div class="text-center mb-4">

                                <span class="class-badge">
                                    <i class="bi bi-book-fill me-1"></i>
                                    <span th:text="${classSession.courseName}"></span>
                                </span>

                                <p class="text-muted mt-3 mb-0">

                                    <i class="bi bi-calendar-event me-1"></i>

                                    Session Date:
                                    <strong th:text="${classSession.sessionDate}"></strong>

                                </p>

                            </div>

                            <div th:if="${error}"
                                 class="alert alert-danger error-box">

                                <i class="bi bi-exclamation-triangle-fill me-2"></i>

                                <span th:text="${error}"></span>

                            </div>

                            <form th:action="@{/attendance/register}"
                                  method="post">

                                <input type="hidden"
                                       name="classSessionId"
                                       th:value="${classSession.id}">

                                <div class="mb-4">

                                    <label class="form-label">
                                        Student Code
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-person-vcard-fill"></i>
                                        </span>

                                        <input type="text"
                                               name="studentCode"
                                               class="form-control"
                                               placeholder="Example: 2026-001"
                                               required>

                                    </div>

                                    <small class="text-muted">
                                        Enter the student code assigned during registration.
                                    </small>

                                </div>

                                <button type="submit"
                                        class="btn btn-success register-button w-100">

                                    <i class="bi bi-check-circle-fill me-2"></i>

                                    Register Attendance

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
