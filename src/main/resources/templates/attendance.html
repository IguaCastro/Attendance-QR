<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h2 class="text-center">Attendance History</h2>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>
                    <tr>
                        <th>Student Code</th>
                        <th>Student Name</th>
                        <th>Course</th>
                        <th>Session Date</th>
                        <th>Attendance Time</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="attendanceItem : ${attendances}">

                        <td th:text="${attendanceItem.student.studentCode}"></td>

                        <td>
                            <span th:text="${attendanceItem.student.firstName}"></span>
                            <span th:text="${attendanceItem.student.lastName}"></span>
                        </td>

                        <td th:text="${attendanceItem.classSession.courseName}"></td>

                        <td th:text="${attendanceItem.classSession.sessionDate}"></td>

                        <td th:text="${attendanceItem.attendanceTime}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div th:if="${#lists.isEmpty(attendances)}"
                 class="alert alert-info text-center">
                No attendance records found.
            </div>

        </div>

    </div>

    <div class="mt-3">
        <a href="/" class="btn btn-secondary">
            Back to Home
        </a>
    </div>

</div>

</body>
</html>
