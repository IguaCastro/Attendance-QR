<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Class Sessions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <!-- CLASS FORM -->
        <div class="card shadow mb-4">

            <div class="card-header bg-success text-white">
                <h2 class="text-center">Class Session</h2>
            </div>

            <div class="card-body">

                <form th:action="@{/classes/save}" th:object="${classSession}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Course Name</label>

                        <input type="text" class="form-control" th:field="*{courseName}"
                            placeholder="Example: English I" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Session Date</label>

                        <input type="date" class="form-control" th:field="*{sessionDate}" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Save Class
                    </button>

                </form>

            </div>
        </div>

        <!-- CLASS LIST -->
        <div class="card shadow">

            <div class="card-header bg-dark text-white">
                <h3>Class Sessions</h3>
            </div>

            <div class="card-body">

                <table class="table table-striped table-hover">

                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Session Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="classItem : ${classSessions}">

                            <td th:text="${classItem.courseName}"></td>
                            <td th:text="${classItem.sessionDate}"></td>

                            <td>
                                <a th:href="@{/classes/edit/{id}(id=${classItem.id})}" class="btn btn-warning btn-sm">
                                    Edit
                                </a>

                                <a th:href="@{/classes/delete/{id}(id=${classItem.id})}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this class session?');">
                                    Delete
                                </a>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>
        </div>

        <div class="mt-3">
            <a href="/" class="btn btn-secondary">
                Back to Home
            </a>
        </div>

    </div>

</body>

</html>
