<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow text-center">

        <div class="card-header bg-primary text-white">
            <h2>Attendance QR Code</h2>
        </div>

        <div class="card-body">

            <h4 th:text="${classSession.courseName}"></h4>

            <p>
                Session Date:
                <strong th:text="${classSession.sessionDate}"></strong>
            </p>

            <hr>

            <img th:src="@{/classes/qr/image/{id}(id=${classSession.id})}"
                 alt="QR Code"
                 class="img-fluid"
                 style="max-width: 300px;">

            <p class="mt-3">
                Students can scan this QR code to register their attendance.
            </p>

            <a href="/classes" class="btn btn-secondary">
                Back to Classes
            </a>

        </div>

    </div>

</div>

</body>
</html>
