<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h2 class="text-center">Student Registration</h2>
            </div>

            <div class="card-body">

                <form th:action="@{/students/save}" th:object="${student}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Student Code</label>
                        <input type="text" class="form-control" th:field="*{studentCode}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" th:field="*{firstName}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" th:field="*{lastName}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Career</label>
                        <input type="text" class="form-control" th:field="*{career}" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Save Student
                    </button>

                </form>

            </div>

        </div>

        <br>

        <div class="card shadow">

            <div class="card-header bg-dark text-white">
                <h3>Registered Students</h3>
            </div>

            <div class="card-body">

                <table class="table table-striped">

                    <thead>

                        <tr>
                            <th>Code</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Career</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="student : ${students}">

                            <td th:text="${student.studentCode}"></td>
                            <td th:text="${student.firstName}"></td>
                            <td th:text="${student.lastName}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.career}"></td>
                            <td>

                                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm">
                                    Edit
                                </a>

                                <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this student?');">
                                    Delete
                                </a>

                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <br>

        <a href="/" class="btn btn-secondary">
            Back to Home
        </a>

    </div>

</body>

</html>
